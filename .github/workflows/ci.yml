name: validate
on: [push, pull_request]
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_workflows.py
      - name: Independent public CLI checks
        run: python tools/independent_check.py
      - name: Internship and school public CLI checks
        run: python tools/opportunity_check.py
      - run: python -m pip install --no-deps .
      - name: Check installed CLI outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          research-roost --version
          research-roost --workspace "$RUNNER_TEMP/research-roost-smoke" init
          research-roost --workspace "$RUNNER_TEMP/research-roost-smoke" doctor
          research-roost modes
          research-roost workflow school
          phd-search --workspace "$RUNNER_TEMP/research-roost-smoke" doctor
          python -m research_roost --version
          python -m phd_search --version
